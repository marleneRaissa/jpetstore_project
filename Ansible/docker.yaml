- name: docker build and push
  hosts: local  # Replace with the hostname or IP address of your target server
  become: true  # Run tasks with sudo privileges

  tasks:
    - name: Stop the container if it's running
      command: docker stop petstore-container-1
      ignore_errors: true

    - name: Remove the stopped container
      command: docker rm -f petstore-container-1
      ignore_errors: true

    - name: Remove the Docker images related to the container
      command: docker image prune -a --force
      ignore_errors: true
       
    - name: Build Docker Image
      command: docker build -t petstore-image:v1 .
      args:
        chdir: /Users/marlene/.jenkins/workspace/petstore_pipeline

    - name: tag image
      command: docker tag petstore-image:v1 marleneraissa/petstore-image:v1 

    - name: Log in to Docker Hub
      shell: >
        echo "{{ dockerhub_token }}"
        | docker login -u marleneraissa --password-stdin
      register: docker_login
      changed_when: 
        - docker_login.rc == 0
        - "'Login Succeeded' in docker_login.stdout"
      failed_when: 
        - docker_login.rc != 0
        - "'Already logged in' not in docker_login.stdout"
    
    - name: Verify authentication status
      shell: docker info | grep "Username:"
      register: auth_check
      changed_when: false

    - name: Debug authentication
      debug:
        msg: "Docker authentication: {{ auth_check.stdout if auth_check.rc == 0 else 'Not authenticated' }}"

    - name: Push image to Docker Hub
      command: docker push marleneraissa/petstore-image:v1
      when: auth_check.rc == 0  # Push seulement si authentifié

    - name: Fail if not authenticated
      fail:
        msg: "Cannot push image: Not authenticated to Docker Hub. Login result: {{ login_result.stderr }}"
      when: auth_check.rc != 0

