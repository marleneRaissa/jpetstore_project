- name: "====================== Docker Push and Run Container ======================"
  hosts: local  # Replace with the hostname or IP address of your target server

  tasks:
    - name: "=========== Login to Docker Hub ==========="
      community.docker.docker_login: #le module docker_login est exécuté localement, donc Ansible a besoin de requests dans son propre interpréteur Python
        username: "marleneraissa"
        password: "{{ dockerhub_token }}"
    
    - name: "=========== Push image to Docker Hub ==========="
      ansible.builtin.command: docker push {{ ecr_repo_url }}/{{ ecr_app_name }}:v1

    - name: "=========== Run Petstore Container ==========="
      ansible.builtin.command: docker run -d --name petstore-container-1 -p 8081:8080 {{ ecr_repo_url }}/{{ ecr_app_name }}:v1
